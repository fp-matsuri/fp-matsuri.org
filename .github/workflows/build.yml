name: Build

on:
  # pull_request トリガーはない。全ブランチの push で走るので、
  # PR のヘッドブランチへの push 自体がここで拾われる (二重実行回避)。
  # 代償として fork 由来の PR では走らない。本リポジトリの運用は
  # リポジトリ内ブランチのみなので現状は問題ない。
  push:
    branches: ['**']

jobs:
  build:
    # 同一ブランチの新しい push が古い run を打ち消す。
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Install dependencies
        run: nix run .#install
      - name: Audit dependencies
        run: nix develop --command pnpm audit --audit-level=high
      - name: Build Tailwind CSS
        run: nix run .#build
      - name: The committed CSS is the fresh build
        run: git diff --exit-code assets/css/app.css
