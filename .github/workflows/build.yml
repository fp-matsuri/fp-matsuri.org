name: Build

# y047aka/elm-motorsport-analysis の test.yml からの移植で、この静的
# サイトに持つ唯一の検査に削っている: GitHub Pages が配る CSS は
# コミット済みの assets/css/app.css だから、再生成した Tailwind ビルドは
# それをバイト単位で再現できなければならない。参照元の VRT/Tauri/
# スナップショット系ワークフローは本サイトに相当物がないため未移植。

on:
  # ブランチ名は絞らない (tags は除く)。このサイトはページ生成物を持たない
  # 静的ファイルの集まりで、失敗のコストは低い。一方 byte fence をどの
  # ブランチでも先に壊しておきたいので、任意ブランチへの push で走らせる。
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # このワークフローが要求し読むのはチェックアウトだけ。既定の書き込み
    # 権限を持たせない。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Install dependencies
        run: nix run .#install
      # 既知 CVE の監査。PR を止めるのは high 以上に絞って運用負荷を下げる。
      - name: Audit dependencies
        run: nix develop --command pnpm audit --audit-level=high
      - name: Build Tailwind CSS
        run: nix run .#build
      # バイトフェンス: 古くなったコミット済み CSS は、誰も意図して
      # ビルドしていないスタイルを配るサイト。だから検査るのはビルド
      # ではなく差分。
      - name: The committed CSS is the fresh build
        run: git diff --exit-code assets/css/app.css
