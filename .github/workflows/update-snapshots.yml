name: Update VRT Snapshots

# Dispatch on the branch whose snapshots you want updated: the run reads
# that branch and pushes back onto it. Ported from
# y047aka/elm-motorsport-analysis's update-snapshots.yml, with the reference's
# local helper (nix/update-snapshots-ci.sh, which dispatches from a terminal
# and then approves the bot's held runs) left out: from a terminal, run
# `gh workflow run update-snapshots.yml --ref <branch>` directly.

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Refuse to run on main
        if: github.ref_name == 'main'
        run: |
          echo "::error::Dispatch this on the branch whose snapshots you want updated, not main."
          exit 1
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Update snapshots on Linux
        run: nix run .#update-snapshots-vrt
      - name: Push updated snapshots
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'tests/*.spec.ts-snapshots/*'
          if git diff --cached --quiet; then
            echo "Snapshots are already current; nothing to push."
            exit 0
          fi
          git commit -m "test: VRT ベースラインを Linux レンダリングで更新 [skip ci]"
          git push origin HEAD:"$BRANCH"
      - uses: actions/upload-artifact@v7
        with:
          name: updated-snapshots
          path: tests/*.spec.ts-snapshots/
          retention-days: 30
